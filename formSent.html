<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./assets/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./src/output.css" rel="stylesheet">
    <title>Helpdesk</title>
  </head>
  <body class="body">
    <div class="flex flex-col min-h-screen p-[5vw]">
      <!-- Contenedor de Logo -->
      <header class="relative">
        <a href="index.html" class="logo-link">
          <img alt="Clínica Sagrada Família logo" height="50" src="./assets/logo-sagrada-familia.svg" href="index.html" class="absolute top-0 left-0"/>
        </a>
      </header>

      <!-- Contenedor principal que ocupa el resto del body -->
      <main class="flex-1 flex flex-col justify-center items-center text-center">
          <h1 class="title1">
           Incidencia enviada correctamente
          </h1><br>

          <div class="flex justify-center items-center mb-6 text-center">
            <div class="w-[25vw]">
              <p>Guarda este codigo para consultar el estado de la incidencia.</p><br>
              <button id="boton-copia" class="w-[15vw] button-copy flex items-center justify-between mx-auto">
                <p id="codigo" class="w-auto py-2 ps-3 text-left">jklYns6321</p>
                <div class="py-2 px-3">
                  <img id="icono-copia" src="assets/copy-icon.svg" alt="copiar" class="h-6 w-6 filter invert"/>
                </div>
              </button>
            </div>

            <div class="separator"> </div>

            <div class="w-[25vw]">
              <p>Introduce tu correo para que te notifiquemos los cambios.</p><br>
              <div class="w-[15vw] flex flex-col mx-auto">
                <div class="button-secondary flex items-center justify-between w-full">
                  <input 
                    id="email-input"
                    placeholder="Email" 
                    type="email" 
                    class="bg-inherit w-auto border-none focus:outline-none hover:border-transparent py-2 ps-3"
                  />
                  <button id="send-email-button" class="icon-button py-2 px-3">
                    <img src="assets/send-icon.svg" alt="Enviar" class="icon-image h-6 w-6"/>
                  </button>
                </div>
                <span id="email-error" class="error-message text-left ps-3"></span>
              </div>
              <div id="success-message" class="success-message mt-2" style="display: none;"></div>
            </div>
          </div>
          <a href="index.html">
            <button class="button-light w-[15vw]">
              Salir
            </button>
          </a>
      </main>
    </div>
    <script type="module">
      import { setupCopyButton } from './src/main.js';

      document.addEventListener('DOMContentLoaded', () => 
      {
        const ticketId = localStorage.getItem('lastCreatedTicket');
        document.getElementById('codigo').textContent = ticketId;
        
        const emailInput = document.getElementById('email-input');
        const emailError = document.getElementById('email-error');
        const successMessage = document.getElementById('success-message');
        const sendButton = document.getElementById('send-email-button');

        function validateEmail(email) 
        {
          const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
          return emailRegex.test(email);
        }

        function showError(message) 
        {
          emailError.textContent = message;
          emailError.style.display = message ? 'block' : 'none';
          successMessage.style.display = 'none';
        }

        function showSuccess(message) 
        {
          successMessage.textContent = message;
          successMessage.style.display = 'block';
          emailError.style.display = 'none';
        }

        emailInput.addEventListener('input', () => 
        {
          const email = emailInput.value.trim();
          if(!email) 
          {
            showError('El correo es obligatorio');
          } 
          else if(!validateEmail(email)) 
          {
            showError('Formato de correo inválido');
          } 
          else 
          {
            showError('');
          }
        });

        sendButton.addEventListener('click', (e) => 
        {
          e.preventDefault();
          const email = emailInput.value.trim();
          
          if(!email) 
          {
            showError('El correo es obligatorio');
            return;
          }
          
          if(!validateEmail(email)) 
          {
            showError('Formato de correo inválido');
            return;
          }

          // Si el correo es valido, mostramos el mensaje de exito
          showSuccess('Correo enviado correctamente');
          emailInput.value = '';
        });

        // Configurar el boton de copiar
        setupCopyButton('codigo', 'icono-copia');
      });
    </script>

    <style>
      .error-message {
        color: #dc2626;
        font-size: 0.875rem;
        margin-top: 0.25rem;
        display: none;
      }

      .success-message {
        color: #059669;
        font-size: 0.875rem;
        text-align: center;
        animation: fadeIn 0.3s ease-in;
      }

      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
    </style>
  </body>
</html>
