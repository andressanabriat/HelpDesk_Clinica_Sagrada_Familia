<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./assets/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./src/output.css" rel="stylesheet">
    <title>ticket</title>
  </head>

  <body class="body">
    <button id="scroll-bottom" class="fixed bottom-8 right-8 p-3 bg-[#003C92] rounded-full border-2 border-[#003C92] opacity-0 transition-opacity duration-300 hover:bg-[#002a66]">
        <svg class="w-6 h-6 transform rotate-90" fill="none" stroke="white" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
        </svg>
    </button>

    <div class="flex flex-col min-h-screen p-[5vw]">
        <header class="relative">
            <a id="logo-link" href="index.html" class="logo-link">
                <img alt="Clínica Sagrada Família logo" height="50" src="./assets/logo-sagrada-familia.svg" href="index.html" class="absolute top-0 left-0"/>
            </a>
        </header>

        <main class="flex-1 flex flex-col justify-center" style="padding-left: 20%; padding-right: 20%;">
            <div class="mb-6">
                <h1 id="ticket-title" class="title1"></h1>
            </div>

            <div class="form-row mb-6">
                <div class="form-group">
                    <label id="ticket-name" style="display: inline-block; width: 100%; margin-bottom: 5px;"><span class="font-bold">Nombre: </span><span class="font-normal"></span></label>
                    <label id="ticket-department" style="display: inline-block; width: 100%;"><span class="font-bold">Departamento: </span><span class="font-normal"></span></label>
                </div>

                <div class="form-group flex flex-col items-end">
                    <label id="ticket-id" class="text-right mb-2 font-bold"></label>
                    <div class="flex items-center gap-2">
                        <span id="ticket-status-text" class="text-sm font-bold">Estado: </span>
                        <div id="ticket-status" class="w-2 h-2 rounded-full"></div>
                    </div>
                </div>
            </div>

            <!-- Mensaje principal destacado -->
            <div class="w-full p-6 mb-8 border-[1px] border-[#003C92] rounded-0 bg-white">
                <div class="flex justify-between items-start mb-2">
                    <div id="main-message" class="text-lg"></div>
                    <span id="main-message-date" class="text-sm text-gray-500"></span>
                </div>
                <div id="main-message-attachments" class="mt-2"></div>
            </div>

            <div class="chat-container mb-6">
                <!-- Contenedor para las respuestas -->
                <div id="responses-container">
                    <!-- Las respuestas se insertaran aqui -->
                </div>
            </div>

            <div class="form-row mb-6">
                <div class="form-group w-full">
                    <label for="response" class="block w-full mb-2 font-medium">Nueva respuesta</label>
                    <textarea 
                        id="response" 
                        placeholder="Escriba su respuesta aquí..."
                    ></textarea>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group flex-1">
                    <label for="file-upload" class="block mb-2 font-medium">Adjuntar archivo</label>
                    <input 
                        type="file" 
                        id="file-upload" 
                        accept=".pdf, .doc, .docx, .png, .jpg, .jpeg" 
                        multiple
                    />
                </div>       
                
                <div class="flex items-end">
                    <button id="respond-button">
                        Responder
                    </button>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { ticketService } from './src/ticketService.js';
  
        function displayAttachedFiles(files) 
        {
            const filesContainer = document.getElementById('attached-files');
            const noFilesMessage = document.getElementById('no-files');
            
            if(!files || files.length === 0) 
            {
                noFilesMessage.style.display = 'block';
                return;
            }
  
            noFilesMessage.style.display = 'none';
            files.forEach(file => {
                const fileElement = document.createElement('div');
                fileElement.className = 'flex items-center justify-between p-2 border-b';
                fileElement.innerHTML = `
                    <span>${file.name}</span>
                    <a href="${file.url}" download class="text-blue-600 hover:text-blue-800">Descargar</a>
                `;
                filesContainer.appendChild(fileElement);
            });
        }
  
        function displayResponses(responses) 
        {
            const container = document.getElementById('responses-container');
            container.innerHTML = '';
  
            if(!responses || responses.length === 0) 
            {
                return;
            }
  
            // Obtener el origen del acceso
            const accessOrigin = ticketService.getAccessOrigin();
            
            // Mostrar el mensaje principal primero
            const mainMessage = document.getElementById('main-message');
            const mainMessageDate = document.getElementById('main-message-date');
            const mainMessageAttachments = document.getElementById('main-message-attachments');

            mainMessage.textContent = responses[0].message;
            mainMessageDate.textContent = responses[0].date;

            // Mostrar archivos adjuntos del mensaje principal
            mainMessageAttachments.innerHTML = '';
            if (responses[0].attachments && responses[0].attachments.length > 0) {
                responses[0].attachments.forEach(file => {
                    const fileLink = document.createElement('a');
                    fileLink.href = file.url;
                    fileLink.download = file.name;
                    fileLink.className = 'text-blue-600 hover:text-blue-800 flex items-center gap-1 mb-1';
                    fileLink.innerHTML = `
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"></path>
                        </svg>
                        ${file.name}
                    `;
                    mainMessageAttachments.appendChild(fileLink);
                });
            }
  
            // Mostrar el resto de respuestas en el chat
            responses.slice(1).forEach(response => 
            {
                const isOwnMessage = (accessOrigin === 'admin' && response.author === 'Administrador') ||
                                   (accessOrigin === 'user' && response.author === 'Usuario');
                
                const messageClass = isOwnMessage ? 'admin-message' : 'user-message';
                
                const responseElement = document.createElement('div');
                responseElement.className = `chat-message ${messageClass}`;
                responseElement.innerHTML = `
                    <div class="message-header">
                        <span class="font-bold">${response.author}</span>
                        <span class="text-gray-500 text-sm">${response.date}</span>
                    </div>
                    <div class="message-content">${response.message}</div>
                    ${response.attachments && response.attachments.length > 0 ? `
                        <div class="message-attachments">
                            ${response.attachments.map(file => `
                                <a href="${file.url}" 
                                   download="${file.name}"
                                   class="text-blue-600 hover:text-blue-800 flex items-center gap-1 mb-1">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"></path>
                                    </svg>
                                    ${file.name}
                                </a>
                            `).join('')}
                        </div>
                    ` : ''}
                `;
                container.appendChild(responseElement);
            });
        }
  
        document.addEventListener('DOMContentLoaded', () => 
        {
            const urlParams = new URLSearchParams(window.location.search);
            const ticketId = urlParams.get('id');
  
            // Configurar el enlace del logo segun el tipo de usuario
            const accessOrigin = ticketService.getAccessOrigin();
            const logoLink = document.getElementById('logo-link');
            if(accessOrigin === 'admin') 
            {
                logoLink.href = 'home.html';
            } 
            else 
            {
                logoLink.href = 'index.html';
            }
  
            if(ticketId) 
            {
                const ticket = ticketService.getTicketById(ticketId);
                if(ticket)
                {
                    document.getElementById('ticket-title').textContent = ticket.title;
                    document.getElementById('ticket-name').innerHTML = `<span class="font-bold">Nombre: </span><span class="font-normal">${ticket.fullName || 'No especificado'}</span>`;
                    const formattedDepartment = ticket.department
                        .replace(/_/g, ' ')
                        .replace(/\b\w/g, l => l.toUpperCase());
                    document.getElementById('ticket-department').innerHTML = `<span class="font-bold">Departamento: </span><span class="font-normal">${formattedDepartment}</span>`;
                    document.getElementById('ticket-id').textContent = `#${ticket.id}`;

                    // Actualizar el estado y el circulo de color
                    let displayStatus = ticket.status;
                    if(ticket.status === 'prioritarios')
                    {
                        displayStatus = 'enCurso';
                    }
                    document.getElementById('ticket-status-text').textContent = getStatusText(displayStatus);
                    document.getElementById('ticket-status').className = `w-2 h-2 rounded-full ${getStatusClass(displayStatus)}`;

                    displayResponses(ticket.responses);
                } 
                else 
                {
                    alert('Ticket no encontrado');
                    window.location.href = 'index.html';
                }
            }
  
            // Modificar el codigo para el boton flotante
            const scrollButton = document.getElementById('scroll-bottom');
  
            // Funcion para verificar si estamos al final de la pagina
            function isPageBottom() 
            {
                const windowHeight = window.innerHeight;
                const documentHeight = document.documentElement.scrollHeight;
                const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
                
                // Consideramos que estamos al final si estamos a menos de 100px del final
                return (windowHeight + scrollTop) >= (documentHeight - 100);
            }
  
            // Mostrar/ocultar el boton basado en la posicion
            window.addEventListener('scroll', () => 
            {
                if(isPageBottom()) 
                {
                    scrollButton.classList.remove('visible');
                }
                else 
                {
                    scrollButton.classList.add('visible');
                }
            });
  
            // Verificar la posicion inicial
            if(!isPageBottom()) 
            {
                scrollButton.classList.add('visible');
            }
  
            // Manejar el clic del boton
            scrollButton.addEventListener('click', () => {
                const responseTextarea = document.getElementById('response');
                responseTextarea.scrollIntoView({ behavior: 'smooth' });
            });
        });
  
        // Manejar el envio de respuesta
        document.getElementById('respond-button').addEventListener('click', async () => 
        {
            const urlParams = new URLSearchParams(window.location.search);
            const ticketId = urlParams.get('id');
            const response = document.getElementById('response').value;
            const fileInput = document.getElementById('file-upload');
            
            if(!response.trim()) 
            {
                alert('Por favor, escriba una respuesta antes de enviar');
                return;
            }
  
            // Procesar archivos adjuntos si los hay
            const attachments = Array.from(fileInput.files).map(file => 
            ({
                name: file.name,
                url: URL.createObjectURL(file)
            }));
  
            // Crear la respuesta
            const responseData = 
            {
                message: response,
                attachments
            };
  
            // Añadir la respuesta al ticket
            if(ticketService.addResponse(ticketId, responseData)) 
            {
                // Actualizar la vista
                const ticket = ticketService.getTicketById(ticketId);
                displayResponses(ticket.responses);
                
                // Limpiar el formulario
                document.getElementById('response').value = '';
                fileInput.value = '';
            }
        });
  
        // Funcion para obtener el texto del estado
        function getStatusText(status) 
        {
          const statusTexts = {
            'prioritarios': 'Prioritario',
            'sinLeer': 'Sin leer',
            'enCurso': 'En curso',
            'cerrados': 'Resuelto'
          };
          return statusTexts[status] || status;
        }
  
        // Funcion para obtener la clase de estilo segun el estado
        function getStatusClass(status) 
        {
          const statusClasses = {
            'prioritarios': 'bg-red-500',
            'sinLeer': 'bg-yellow-500',
            'enCurso': 'bg-blue-500',
            'cerrados': 'bg-green-500'
          };
          return statusClasses[status] || '';
        }
    </script>

    <style>
        .chat-container {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            padding: 0.75rem;
        }

        .chat-message {
            max-width: 70%;
            padding: 0.375rem 0.625rem;
            border: 1px solid #003C92;
            border-radius: 0;
        }

        .user-message {
            align-self: flex-start;
            background-color: #003C92;
            margin-right: auto;
            border-left: 4px solid #003C92;
            color: white;
        }

        .admin-message {
            align-self: flex-end;
            background-color: #ffffff;
            margin-left: auto;
            border-right: 4px solid #003C92;
            color: inherit;
        }

        .message-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.125rem;
            font-size: 0.875rem;
        }

        .user-message .message-header span,
        .user-message .message-content {
            color: white;
        }

        .user-message .text-gray-500 {
            color: rgba(255, 255, 255, 0.8);
        }

        .admin-message .message-header span,
        .admin-message .message-content {
            color: inherit;
        }

        .admin-message .text-gray-500 {
            color: #6b7280;
        }

        .message-content {
            white-space: pre-wrap;
            margin-bottom: 0.125rem;
            font-size: 0.9375rem;
            line-height: 1.3;
        }

        .message-attachments {
            border-top: 1px solid #003C92;
            padding-top: 0.125rem;
            margin-top: 0.125rem;
        }

        .user-message .message-attachments a {
            color: rgba(255, 255, 255, 0.9);
        }

        .admin-message .message-attachments a {
            color: #4b5563;
        }

        .user-message .message-attachments a:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .admin-message .message-attachments a:hover {
            background-color: rgba(0, 0, 0, 0.05);
        }

        /* Estilos para la seccion de nueva respuesta */
        .form-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }

        #response {
            width: 100%;
            border: 1px solid #003C92;
            padding: 0.75rem 1rem;
            min-height: 100px;
            resize: vertical;
            border-right: 4px solid #003C92;
            border-radius: 0;
        }

        #response:focus {
            outline: none;
            border-color: #003C92;
        }

        #file-upload {
            padding: 0.5rem;
            margin-top: 0;
        }

        #respond-button {
            background-color: #003C92;
            border: none;
            color: white;
            padding: 0.75rem 1.5rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        #respond-button:hover {
            background-color: #003C92;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        /* Añadir espacio extra cuando cambia el autor */
        .chat-message + .chat-message:not(.user-message + .user-message):not(.admin-message + .admin-message) {
            margin-top: 1rem;  /* Espacio extra entre mensajes de diferente autor */
        }

        /* Añadir estilos para el boton flotante */
        #scroll-bottom {
            z-index: 1000;
            cursor: pointer;
            transition: opacity 0.3s, background-color 0.3s;
        }

        #scroll-bottom.visible {
            opacity: 1;
        }
    </style>
  </body>   
</html>
