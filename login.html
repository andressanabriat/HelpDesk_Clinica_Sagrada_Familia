<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./assets/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./src/output.css" rel="stylesheet">
    <title>login</title>

  <body class="body">
    <div class="flex flex-col min-h-screen p-[5vw]">
        <header class="relative">
            <a href="login.html" class="logo-link">
                <img alt="Clínica Sagrada Família logo" height="50" src="./assets/logo-sagrada-familia.svg" href="index.html" class="absolute top-0 left-0"/>

            <div style="text-align: center;">
                <label for="ticket-title" style="display: block; text-align: left; width: 300px; margin: 0 auto 5px auto;">Correo electrónico</label>

                <label for="ticket-title" style="display: block; text-align: left; width: 300px; margin: 0 auto 5px auto;">Contraseña</label>

            </div><br><br>
            
            <div style="text-align: center;">
                <a href="home.html">
                    <button class="button-primary" style="width: 300px; margin: 0 auto; margin-bottom: 15px;">

            <div style="text-align: center;">
