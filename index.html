<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./assets/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./src/output.css" rel="stylesheet">
    <title>Helpdesk</title>
  </head>
  <body class="body">
    <div class="flex flex-col min-h-screen p-[5vw]">
      <!-- Contenedor de Logo -->
      <header class="relative">
        <a href="index.html" class="logo-link">
          <img alt="Clínica Sagrada Família logo" height="50" src="./assets/logo-sagrada-familia.svg" href="index.html" class="absolute top-0 left-0"/>
        </a>
      </header>

      <!-- Contenedor principal que ocupa el resto del body -->
      <main class="flex-1 flex flex-col justify-center items-center text-center">
        <h1 class="title1 mb-4">HelpDesk</h1>
        <p class="italic w-[50vw] mb-8">
          "Valoramos profundamente su opinión y sugerencias, ya que son fundamentales para mejorar nuestro entorno de trabajo. Agradecemos su colaboración y el esfuerzo continuo por ayudarnos a crecer y ofrecer un mejor servicio cada día."
        </p>
        <div class="flex flex-col md:flex-row items-center space-y-4 md:space-y-0 md:space-x-6">
          <a href="form.html" class="w-[15vw]">
            <button class="button-primary w-full">
              Nuevo ticket
            </button>
          </a>
          <div class="button-secondary flex items-center w-[15vw]">
            <input 
              id="search-ticket"
              type="text" 
              placeholder="Buscar ticket"
              class="bg-inherit w-full min-w-0 border-none focus:outline-none hover:border-transparent py-2 ps-3"
            />
            <button id="search-button" class="icon-button flex-shrink-0 py-2 px-3">
              <img src="assets/search-icon.svg" alt="Buscar" class="icon-image h-6 w-6"/>
            </button>
          </div>
        </div>
      </main>
    </div>
    <script type="module">
      import { ticketService } from './src/ticketService.js';

      document.getElementById('search-button').addEventListener('click', () => 
      {
        const ticketId = document.getElementById('search-ticket').value.trim();
        const ticket = ticketService.getTicketById(ticketId);
        
        if(ticket) 
        {
          ticketService.setAccessOrigin('user');
          window.location.href = `ticket.html?id=${ticketId}`;
        } 
        else 
        {
          alert('No se encontró ningún ticket con ese ID');
        }
      });

      // Tambien permitir busqueda con Enter
      document.getElementById('search-ticket').addEventListener('keypress', (e) => 
      {
        if(e.key === 'Enter') 
        {
          document.getElementById('search-button').click();
        }
      });
    </script>
  </body>
</html>
